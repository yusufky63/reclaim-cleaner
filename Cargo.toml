[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yusufky63/reclaim-cleaner"
authors = ["yusufky63"]
rust-version = "1.90"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

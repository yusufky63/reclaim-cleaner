name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: If the app deleted something it should not have, say so in the title. Those reports are handled first.
  - type: input
    id: version
    attributes:
      label: ReClaim version
      description: Settings > About.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 24H2 (26100.2033)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Setup (.exe)
        - MSI
        - Portable zip
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Running as administrator?
      options:
        - "No"
        - "Yes"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Junk & caches
        2. Click Scan
        3. ...
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Paths involved
      description: Remove anything private. Paths shown in the app can be copied with right-click.
      render: text

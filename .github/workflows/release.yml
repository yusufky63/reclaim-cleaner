name: Release

# Normally called by the Release PR workflow once a release PR is merged; a pushed tag still
# works for a release made by hand.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to build, such as v0.3.0.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A tag pushed without bumping the version would ship installers that call themselves
      # the previous version.
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match package.json version $version. Merge the release PR instead of tagging by hand." }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --workspace --locked

      - name: Build installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Package portable zip and checksums
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          $version = $tag.TrimStart('v')
          # Release notes are the CHANGELOG section for this version.
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes += "`n`n### Verify your download`nSHA-256 checksums are in SHA256SUMS.txt. Builds are not code-signed yet; see the README for the SmartScreen note."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $tag --draft --title "ReClaim Cleaner $version" --notes-file release-notes.md (Get-ChildItem release -File | ForEach-Object FullName)
